<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Service</title>
    <style>
        /* Base page styling */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f9fa;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top blue header bar */
        .header-bar {
            width: 100%;
            height: 50px;
            background-color: #007bff;
            margin-bottom: 40px;
        }

        /* Main container layout */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: left;
        }

        h1 {
            text-align: center;
            font-weight: 400;
            font-size: 2rem;
            color: #2b2b2b;
            margin-bottom: 30px;
        }

        /* Form groups & labels */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #666666;
            margin-bottom: 6px;
        }

        /* Inputs and Textarea styling */
        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        textarea:focus, input:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        /* Buttons styles */
        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid transparent;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 4px;
            transition: background-color 0.15s ease-in-out;
            color: white;
        }

        /* Translate button (Full width, Blue) */
        .btn-translate {
            width: 100%;
            background-color: #007bff;
            border-color: #007bff;
            margin-top: 5px;
        }

        .btn-translate:hover {
            background-color: #0069d9;
        }

        /* Check Status button (Teal) */
        .btn-status {
            background-color: #17a2b8;
            border-color: #17a2b8;
            margin-right: 5px;
        }

        .btn-status:hover {
            background-color: #138496;
        }

        /* Check Content button (Dark Gray) */
        .btn-content {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-content:hover {
            background-color: #5a6268;
        }

        /* Layout wrapper for the inline check buttons */
        .button-group {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- Top Blue Banner -->
    <div class="header-bar"></div>

    <div class="container">
        <h1>Translation Service</h1>

        <!-- SECTION 1: Translate Text -->
        <div class="form-group">
            <label for="text-to-translate">Text to translate</label>
            <textarea id="text-to-translate" placeholder="Enter text here..."></textarea>
        </div>

        <div class="form-group">
            <label for="languages">Languages (comma-separated)</label>
            <input type="text" id="languages" placeholder="e.g., es,fr,de">
        </div>

        <button type="button" id="btn-translate" class="btn btn-translate">Translate</button>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #e9ecef;">
        </div>
    </div>
    <script>
        async function translateText() {
        // Extract the text and languages from the form
        var text_for_translation = document.getElementById('text-to-translate').value;
        var languages_chosen = document.getElementById('languages').value;

        // Prepare the payload
        var payload = {
            text: text_for_translation,
            languages: languages_chosen
        };

        try {
            // Execute the POST request to the translation endpoint
            const response = await fetch('http://127.0.0.1:8000/translate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
            });

            // Check if the response is OK
            if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
            }

            // Parse and handle the response
            const result = await response.json();
            alert('Translation request submitted. ID: ' + result.id);
            window.location.href = '/translate/' + result.id;
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to submit translation request.');
        }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
